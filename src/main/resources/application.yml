spring:
  application:
    name: spending-coach
  datasource:
    url: jdbc:postgresql://localhost:5432/spending_coach
    username: app
    password: app
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

agent:
  loop:
    max-steps: 8
    max-wall-clock-seconds: 30
    loop-nudge-threshold: 2
    loop-abort-threshold: 3
