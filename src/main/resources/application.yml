spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: spending-coach
  datasource:
    url: jdbc:postgresql://localhost:5432/spending_coach
    username: app
    password: app
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

agent:
  loop:
    max-steps: 8
    max-wall-clock-seconds: 30
    loop-nudge-threshold: 2
    loop-abort-threshold: 3
  providers:
    gemini:
      name: gemini
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY}
      model: gemini-flash-lite-latest
      rpm: 15
      tpm: 250000
      rpd: 500
    groq:
      name: groq
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY}
      model: openai/gpt-oss-20b
      rpm: 30
      tpm: 8000
      rpd: 1000

resilience4j:
  circuitbreaker:
    instances:
      gemini:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        record-exceptions:
          - com.intellermatrix.spending_coach.agent.provider.ProviderUnavailableException
      groq:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        record-exceptions:
          - com.intellermatrix.spending_coach.agent.provider.ProviderUnavailableException
